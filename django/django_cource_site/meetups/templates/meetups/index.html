{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>All Meetups</title>
    <link rel="stylesheet" href="{% static 'meetups/styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'meetups/styles/all-meetups.css' %}">
</head>
<body>
<header id="main-header">
    <nav><a href="/meetups" id="main-logo">DjangoMeetups</a></nav>
    <h1>We got great meetups coming ahead</h1>
    <p>Find the one that best suits your needs</p>
</header>
<main>
    <section>
        <h2>Upcoming Meetups</h2>
        <ol>
            {% for meetup_item in meetups %}
                <li class="meetup-item">
                    <article>
                        <div class="meetup-summary">
                            <div class="meetup-image">
                                <img src="" alt="">
                            </div>
                            <div class="meetup-details">
                                <h3>
                                    {{ meetup_item.title }}
                                    <address>{{ meetup_item.location }}</address>
                                </h3>
                            </div>
                        </div>
                        <div class="meetup-action">
                            <a href="" class="btn">More details</a>
                        </div>
                    </article>
                </li>
            {% endfor %}
        </ol>
    </section>
</main>
</body>
</html>
